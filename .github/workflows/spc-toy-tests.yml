name: SPC toy protocol tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python prepare_spc_blind_inputs.py --help
      - run: python run_spc_stage1.py --help
      - run: python run_spc_stage2.py --help
      - run: python run_spc_asr.py --help
